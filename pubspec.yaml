name: tkc_vender_auth
description: Vendor host app — authentication and mini-app launcher.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  flutter_secure_storage: ^10.2.0
  dio: ^5.9.2
  flutter_dotenv: ^6.0.1
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  miniapp_concert:
    path: ../tkc_concert_booking
  miniapp_shopping:
    path: ../tkc_shopping

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - .env
